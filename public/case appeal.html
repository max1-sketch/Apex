<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appeal This Action</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card-bg: #ffffff;
      --card-border: #e5e7eb;
      --accent: #3b82f6;
      --accent-text: #ffffff;
      --danger: #ef4444;
      --danger-soft: #fdecec;
      --success: #10b981;
      --success-soft: #e8f9f3;
      --warning: #f59e0b;
      --warning-soft: #fef4e3;
      --text: #16181d;
      --text-muted: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; padding: 2.5rem 1.25rem; }
    .wrap { width: 100%; max-width: 560px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 2rem; box-shadow: 0 1px 3px rgba(16,24,40,0.06); }
    h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.5rem; }
    .case-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.6; }
    .case-meta b { color: var(--text); }
    .reason-box { background: #f8f8fa; border: 1px solid var(--card-border); border-radius: 10px; padding: 0.9rem 1rem; font-size: 0.88rem; margin-bottom: 1.5rem; }
    .field { margin-bottom: 1.4rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
    textarea {
      width: 100%; background: #f8f8fa; border: 1px solid var(--card-border); border-radius: 10px;
      padding: 0.75rem 0.9rem; font-size: 0.9rem; color: var(--text); outline: none; transition: border-color .15s;
      resize: vertical; min-height: 120px;
    }
    textarea:focus { border-color: var(--accent); background: #fff; }
    button.submit-btn {
      width: 100%; background: var(--accent); color: var(--accent-text); border: none; border-radius: 10px;
      padding: 0.85rem 1rem; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 0.5rem;
    }
    button.submit-btn:hover { filter: brightness(0.95); }
    button.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-banner { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 0.8rem 1rem; font-size: 0.85rem; font-weight: 600; margin-bottom: 1.25rem; }
    .status-banner { border-radius: 10px; padding: 1rem 1.1rem; font-size: 0.88rem; margin-bottom: 1rem; }
    .status-banner.pending { background: var(--warning-soft); color: #92620a; }
    .status-banner.accepted { background: var(--success-soft); color: #0d6b4a; }
    .status-banner.rejected { background: var(--danger-soft); color: var(--danger); }
    .status-banner .title { font-weight: 700; margin-bottom: 0.3rem; display: block; }
    .center-state { text-align: center; padding: 3rem 1rem; }
    .center-state .icon { font-size: 2.4rem; margin-bottom: 1rem; }
    .center-state h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .center-state p { color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="cardRoot">
      <div class="center-state"><div class="icon">⏳</div><p>Loading case...</p></div>
    </div>
  </div>

  <script>
    const caseId = window.location.pathname.split('/').filter(Boolean).pop();

    const TYPE_LABELS = { ban: 'Ban', mute: 'Timeout / Mute', warn: 'Warning' };

    function renderError(message) {
      document.getElementById('cardRoot').innerHTML = `
        <div class="center-state">
          <div class="icon">🚫</div>
          <h2>Can't load this case</h2>
          <p>${message}</p>
        </div>
      `;
    }

    function renderCase(c) {
      const typeLabel = TYPE_LABELS[c.type] || c.type;
      const dateStr = new Date(c.timestamp).toLocaleString();

      let statusHtml = '';
      let formHtml = '';

      if (c.appealStatus === 'pending') {
        statusHtml = `
          <div class="status-banner pending">
            <span class="title">⏳ Appeal Under Review</span>
            Your appeal has been submitted and is waiting on staff to review it. You'll be DMed once there's a decision.
          </div>
          <div class="reason-box"><b>Your appeal:</b><br>${c.appealReason}</div>
        `;
      } else if (c.appealStatus === 'accepted') {
        statusHtml = `
          <div class="status-banner accepted">
            <span class="title">✅ Appeal Accepted</span>
            Your appeal was accepted by staff.
          </div>
        `;
      } else if (c.appealStatus === 'rejected') {
        statusHtml = `
          <div class="status-banner rejected">
            <span class="title">❌ Appeal Rejected</span>
            Your appeal was reviewed and not accepted. This case cannot be appealed again.
          </div>
        `;
      } else {
        formHtml = `
          <div id="errorBanner"></div>
          <form id="appealForm">
            <div class="field">
              <label>Why should this be reconsidered?</label>
              <textarea id="appealMessage" required placeholder="Explain your side — be specific and honest."></textarea>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Submit Appeal</button>
          </form>
        `;
      }

      document.getElementById('cardRoot').innerHTML = `
        <h1>Appeal Your ${typeLabel}</h1>
        <div class="case-meta">
          <b>Action:</b> ${typeLabel}<br>
          <b>Date:</b> ${dateStr}
        </div>
        <div class="reason-box"><b>Staff reason:</b><br>${c.reason || 'No reason given.'}</div>
        ${statusHtml}
        ${formHtml}
      `;

      const form = document.getElementById('appealForm');
      if (form) form.addEventListener('submit', onSubmit);
    }

    async function onSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'Submitting...';

      const message = document.getElementById('appealMessage').value;

      try {
        const res = await fetch(`/api/case-appeal/${caseId}/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        if (data.success) {
          init(); // reload to show the "pending" state
        } else {
          document.getElementById('errorBanner').innerHTML = `<div class="error-banner">${data.error}</div>`;
          btn.disabled = false;
          btn.innerText = 'Submit Appeal';
        }
      } catch (err) {
        document.getElementById('errorBanner').innerHTML = `<div class="error-banner">Something went wrong. Try again.</div>`;
        btn.disabled = false;
        btn.innerText = 'Submit Appeal';
      }
    }

    async function init() {
      if (!caseId) return renderError('No case specified in the URL.');
      try {
        const res = await fetch(`/api/case-appeal/${caseId}`);
        const data = await res.json();
        if (data.success) {
          renderCase(data.case);
        } else {
          renderError(data.error || 'This case is unavailable.');
        }
      } catch (err) {
        renderError('Could not reach the server. Try again shortly.');
      }
    }

    init();
  </script>
</body>
</html>
